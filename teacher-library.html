<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>교사용 서재 · 자람새</title>
<style>
  :root{
    --bg: #eef1fb;
    --card: #ffffff;
    --blue: #6c8ef5;
    --blue-light: #eaf0ff;
    --text: #1f2430;
    --text-sub: #8a8fa3;
    --border: #edeff5;
    --amber: #d99a1f;
    --amber-light: #fff1d6;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#fff;
    padding: 14px 32px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top:0;
    z-index: 10;
  }
  .logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size: 1.3rem;
    font-weight:700;
    text-decoration:none;
    color: inherit;
  }
  .logo svg{ width:30px; height:30px; }

  .header-right{ display:flex; align-items:center; gap: 20px; }
  .back-link{
    font-size: .85rem;
    color: var(--text-sub);
    text-decoration:none;
  }
  .back-link:hover{ color: var(--text); }

  .user-area{
    display:flex;
    align-items:center;
    gap:10px;
    padding-left: 20px;
    border-left: 1px solid var(--border);
  }
  .profile-link{ display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit; }
  .user-area .avatar-sm{
    width:34px; height:34px; border-radius:50%;
    background: linear-gradient(135deg, #cfd8f6, #a9b8ea);
    flex: 0 0 auto;
  }
  .user-area .user-info{ display:flex; flex-direction:column; line-height:1.3; }
  .user-area .user-info strong{ font-size: .85rem; }
  .user-area .role-badge{
    font-size: .68rem;
    padding: 1px 7px;
    border-radius: 8px;
    background: var(--amber-light);
    color: var(--amber);
    font-weight:600;
    width: fit-content;
  }
  .user-area .logout-btn{
    background:none; border:none;
    font-size: .78rem; color: var(--text-sub);
    cursor:pointer; padding: 6px 4px;
  }
  .user-area .logout-btn:hover{ color: var(--text); }

  .wrap{
    max-width: 980px;
    margin: 32px auto;
    padding: 0 24px;
  }

  .page-banner{
    display:flex;
    align-items:center;
    gap:14px;
    background: linear-gradient(135deg, #fffaf0, #fff);
    border: 1px solid #ffe4b0;
    border-radius: 18px;
    padding: 20px 24px;
    margin-bottom: 24px;
  }
  .page-banner .icon{
    width:48px; height:48px;
    border-radius: 12px;
    background: var(--amber-light);
    display:flex; align-items:center; justify-content:center;
    flex: 0 0 auto;
  }
  .page-banner .icon svg{ width:24px; height:24px; stroke: var(--amber); }
  .page-banner h1{ margin: 0 0 4px; font-size: 1.25rem; }
  .page-banner p{ margin:0; font-size: .85rem; color: var(--text-sub); }

  .grid{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }
  .lib-card{
    background: var(--card);
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 1px 3px rgba(20,30,60,.04);
  }
  .lib-card .icon{
    width:40px; height:40px;
    border-radius: 10px;
    background: var(--blue-light);
    display:flex; align-items:center; justify-content:center;
    margin-bottom: 12px;
  }
  .lib-card .icon svg{ width:20px; height:20px; stroke: var(--blue); }
  .lib-card h3{ margin: 0 0 6px; font-size: 1rem; }
  .lib-card p{ margin:0; font-size: .82rem; color: var(--text-sub); line-height:1.5; }

  @media (max-width: 700px){
    .grid{ grid-template-columns: 1fr; }
    header{ padding: 12px 16px; }
    .wrap{ padding: 0 14px; }
    .user-area .user-info{ display:none; }
  }
</style>
</head>
<body>

<header>
  <a class="logo" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="#6c8ef5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 8c0 3-2.5 4-5 4l-1 6h-3l-1-4c-3 0-6-2-6-6 0-1 .3-2 1-3 .5 1 1.5 1.5 2.5 1.5C8 4 10 3 12 3c1 0 2 .3 2.8.9C15.5 3.3 16.7 3 18 3c0 1.2-.4 2.2-1.2 3 1.4.5 2.2 1.2 3.2 2z"/>
      <circle cx="16.5" cy="7.5" r=".6" fill="#6c8ef5"/>
    </svg>
    <span>자람새</span>
  </a>

  <div class="header-right">
    <a class="back-link" href="index.html">← 홈으로</a>
    <div class="user-area">
      <a class="profile-link" href="profile.html">
        <div class="avatar-sm"></div>
        <div class="user-info">
          <strong id="userName">-</strong>
          <span class="role-badge" id="userRoleBadge">교사</span>
        </div>
      </a>
      <button class="logout-btn" onclick="logout()">로그아웃</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="page-banner">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    </div>
    <div>
      <h1>교사용 서재</h1>
      <p>이 공간은 교사 계정으로 로그인했을 때만 보이는 private한 공간입니다. 학부모 계정에는 노출되지 않아요.</p>
    </div>
  </div>

  <div class="grid">
    <div class="lib-card">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="14" height="14" rx="2"/><circle cx="8" cy="9" r="1.5"/><path d="M4 15l4-4 3 3 3-4 3 4"/></svg>
      </div>
      <h3>우리 반 성장 기록</h3>
      <p>담당 학급 아이들의 성장 기록과 활동 사진을 모아볼 수 있어요.</p>
    </div>

    <div class="lib-card">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.5 7.2L3 20l1.1-5A8 8 0 1 1 21 12z"/></svg>
      </div>
      <h3>학부모 상담 예약</h3>
      <p>학부모가 신청한 상담 요청 목록을 확인하고 일정을 관리해요.</p>
    </div>

    <div class="lib-card">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>
      </div>
      <h3>수업/교육 자료실</h3>
      <p>교사끼리 공유하는 수업 자료와 육아 교육 콘텐츠를 모아둔 공간이에요.</p>
    </div>

    <div class="lib-card">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 3.5l4 4L8 20l-5 1 1-5z"/></svg>
      </div>
      <h3>공지사항 작성</h3>
      <p>학부모에게 전달할 공지사항이나 안내문을 작성하고 발행해요.</p>
    </div>
  </div>
</div>

<script src="auth.js"></script>
<script>
  const auth = requireTeacher();
  if (auth) {
    document.getElementById('userName').textContent = auth.id;
  }
</script>

</body>
</html>
